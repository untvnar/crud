<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Iframe Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
    .content {
        display: none;
        padding: 15px;
        margin-top: 10px;
        border: 1px solid #ccc;
        border-radius: 20px;
        }
    button {
        margin: 5px;
        padding: 10px 15px;
        background-color: darkgreen;
        color: white;
        border-color: white;
        }
</style>
 
</head>
<body>

    Team name: <b>Aklan</b><br>
    Region: Western Visayas<br><br>

<button onclick="toggleContent('core')">Core</button>
<button onclick="toggleContent('geography')">Geography</button>

<div id="geography" class="content">
    <b>Geography</b><br><br>
    <p>Province: Aklan<br>
        Capital: Kalibo<br>
        Island: Panay Island<br>
        Municipalities: 17<br>
        Cities: 0<br>
        Barangays: 327<br>
    </p>
</div>

<div id="core" class="content">
<b>Core</b><br><br>
    <p>Operations: <br>
        Administration: <br>
        Training: <br>
        Productions: <br>
        Minder: <br>
        Custodian: <br>
        Treasurer: <br>
        Auditor: <br>
        Ways and Means: <br>
    </p>
</div>

<script>
function toggleContent(id) {
    const content = document.getElementById(id);

    if (content.style.display === "block") {
        content.style.display = "none";
    } else {
        content.style.display = "block";
    }
}
</script>

</body>

</html>
