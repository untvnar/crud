<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDA Marlon Toradio</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        iframe {
            width: 100%;
            height: 80vh;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

<div class="container mt-3">

    Welcome, <b>Marlon Toradio</b>, RDA<hr>
    Tandem regions:<br>R5, R6, NCR-D5 &nbsp; | &nbsp; R7, R8, NCR-D1<br><br>

    <!-- REGIONS -->
    <div class="mb-3">
        <select id="category" class="form-select">
            <option value="">-- Select region --</option>
            <option value="region5">Region V - Bicol</option>
            <option value="region6">Region VI - Western Visayas</option>
            <option value="region7">Region VII - Central Visayas</option>
            <option value="region8">Region VIII - Eastern Visayas</option>
        </select>
    </div>

    <!-- TEAMS -->
    <div class="mb-3">
        <select id="page" class="form-select">
            <option value="">-- Select team --</option>
        </select><br>
    </div>

    <!-- iFRAME -->
    <iframe id="contentFrame" style="border: none;"></iframe>

</div>

<script>

// Pages for each category
const pages = {

    region5: [
        { name: "Albay", url: "albay.html" },
        { name: "Camarines Norte", url: "camnorte.html" },
        { name: "Camarines Sur", url: "camsur.html" },
        { name: "Catanduanes", url: "catanduanes.html" },
        { name: "Masbate", url: "masbate.html" },
        { name: "Sorsogon", url: "sorsogon.html" }
    ],

    region6: [
        { name: "Aklan", url: "templates/aklan.html" },
        { name: "Antique", url: "antique.html" },
        { name: "Capiz", url: "capiz.html" },
        { name: "Iloilo", url: "iloilo.html" },
        { name: "Negros Occidental", url: "negros.html" }
    ],

    region7: [
        { name: "Bohol", url: "bohol.html" },
        { name: "Cebu", url: "cebu.html" }
    ],

    region8: [
        { name: "Leyte", url: "leyte.html" },
        { name: "Eastern Samar", url: "samar_e.html" },
        { name: "Northern Samar", url: "samar_n.html" },
        { name: "Samar (Western)", url: "samar_w.html" }
    ]

};

const categorySelect = document.getElementById("category");
const pageSelect = document.getElementById("page");
const iframe = document.getElementById("contentFrame");

// Populate second combo box
categorySelect.addEventListener("change", function () {

    pageSelect.innerHTML =
        '<option value="">Select Page</option>';

    const selectedCategory = this.value;

    if (pages[selectedCategory]) {

        pages[selectedCategory].forEach(page => {

            const option = document.createElement("option");

            option.value = page.url;
            option.textContent = page.name;

            pageSelect.appendChild(option);

        });

    }

});

// Load page into iframe
pageSelect.addEventListener("change", function () {

    iframe.src = this.value;

});

</script>

</body>
</html>
